name: CI

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: postbox-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: true
      - run: uv sync --locked --python "$POSTBOX_CI_PYTHON"
        env:
          POSTBOX_CI_PYTHON: ${{ matrix.python }}
      - run: uv run --no-sync ruff format --check
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync mypy
      - run: uv run --no-sync pytest -q
      - name: Audit locked runtime dependencies
        if: matrix.python == '3.13'
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements.txt -o "$RUNNER_TEMP/postbox-requirements.txt" --quiet
          uv run --no-sync pip-audit --require-hashes --disable-pip -r "$RUNNER_TEMP/postbox-requirements.txt"

  container:
    if: github.ref_type != 'tag'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false

  publish:
    if: github.ref_type == 'tag'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check version tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Use a release tag such as v0.1.0."
            exit 1
          fi
          python - <<'PY'
          import os, tomllib
          with open("pyproject.toml", "rb") as file:
              version = tomllib.load(file)["project"]["version"]
          if "v" + version != os.environ["GITHUB_REF_NAME"]:
              raise SystemExit("The release tag must match the project version.")
          PY
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: metadata
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: type=semver,pattern={{version}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: true
          sbom: true
