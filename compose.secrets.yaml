# Remove matching environment entries from .env; environment takes precedence.
services:
  postbox:
    secrets:
      - IMAP_PASSWORD
      - SMTP_PASSWORD
      - MCP_AUTH_TOKEN

secrets:
  IMAP_PASSWORD:
    file: ./secrets/imap_password
  SMTP_PASSWORD:
    file: ./secrets/smtp_password
  MCP_AUTH_TOKEN:
    file: ./secrets/mcp_auth_token
